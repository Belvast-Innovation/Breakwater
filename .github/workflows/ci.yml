name: ci

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs the same checks on the commit it is about to publish.
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  ci:
    # The job id "ci" is the status-check context required by the main branch ruleset.
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-27
        with:
          # Pinned by SHA, the action cannot read the toolchain from its ref name.
          toolchain: stable
          targets: wasm32v1-none
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Rustdoc warnings (broken links, missing docs) fail the build, because docs.rs
      # renders the published crates from exactly these comments.
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      # Every published crate ships the license and notice files from the repository root;
      # cargo only packages files inside the crate directory, so the copies must not drift.
      - name: Check license and notice copies
        run: |
          for crate in crates/breakwater crates/breakwater-cli crates/packs/policy-bypass crates/packs/ttl-archival crates/packs/budget-snapshot; do
            for file in LICENSE NOTICE; do
              cmp "$file" "$crate/$file" || { echo "::error::$crate/$file differs from $file"; exit 1; }
            done
          done

      # Both demos must find their bug: `breakwater run` exits 1 on a violation,
      # so 0 (nothing found) or 2 (usage or setup error) fails the build. A relative
      # --json path from the repository root must produce a report the CLI can render.
      - name: Smoke-test the CLI demos
        run: |
          set +e
          cargo build -q -p breakwater-cli
          cli=target/debug/breakwater
          for demo in "policy-bypass 7" "ttl-archival 11"; do
            # shellcheck disable=SC2086 # split "<example> <seed>" into $1 and $2
            set -- $demo
            "$cli" --no-color run "examples/$1" --seed "$2"
            code=$?
            if [ "$code" -ne 1 ]; then
              echo "::error::breakwater run examples/$1 --seed $2 exited with $code, expected 1"
              exit 1
            fi
          done
          "$cli" --no-color run examples/policy-bypass --seed 7 --json run.json
          [ $? -eq 1 ] || { echo "::error::run --json run.json did not report the violation"; exit 1; }
          "$cli" --no-color report run.json --html report.html
          code=$?
          [ "$code" -le 1 ] || { echo "::error::report exited with $code"; exit 1; }
          test -s run.json || { echo "::error::run.json was not written"; exit 1; }
          test -s report.html || { echo "::error::report.html was not written"; exit 1; }
          rm -f run.json report.html

      # The committed .breakwater-snapshot.json is the resource baseline of the
      # ttl-archival demo. Metering is deterministic: for the locked dependencies
      # the numbers are the same on every machine, so the check runs with a 0%
      # tolerance (the CLI default of 5% is meant for local use). The contract as
      # it stands must match the baseline exactly (exit 0), and the same suite
      # built with the demo regression must be caught (exit 1). Exit 2 means the
      # snapshot is missing, malformed or stale, which fails the build too.
      - name: Check the budget snapshot
        run: |
          set +e
          cli=target/debug/breakwater
          "$cli" --no-color snapshot examples/ttl-archival --check --tolerance 0%
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::snapshot --check --tolerance 0% exited with $code, expected 0 (record it again with 'breakwater snapshot examples/ttl-archival' if the change is intended)"
            exit 1
          fi
          "$cli" --no-color snapshot examples/ttl-archival --check --tolerance 0% --features regress-demo
          code=$?
          if [ "$code" -ne 1 ]; then
            echo "::error::snapshot --check --tolerance 0% --features regress-demo exited with $code, expected 1"
            exit 1
          fi

      # soroban-sdk 28 refuses a bare `cargo build --target wasm32v1-none`: its build
      # script requires the spec-shaking support that only `stellar contract build` provides.
      - uses: stellar/stellar-cli@c0f4d0da891bbf214c08b8c5035ae6db80e9a3bd # v28.1.0
        with:
          # Pinned by SHA, the action would take the SHA as the version to download.
          version: 28.1.0

      - name: Build example contracts (wasm)
        run: |
          stellar contract build --package example-policy-bypass
          stellar contract build --package example-owner-account
          stellar contract build --package example-spending-limit-policy
          stellar contract build --package example-ed25519-verifier
          stellar contract build --package example-ttl-archival
