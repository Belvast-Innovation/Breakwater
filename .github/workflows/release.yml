name: release

# Publishing a version = merging a version-bump PR (see .claude/skills/release/SKILL.md)
# and approving the crates-io environment once. Every push to main is planned; a push
# that does not change the version ends in the plan job with "nothing to do".
#
# crates.io access uses Trusted Publishing: crates.io is configured to accept an OIDC
# token from this workflow file in the crates-io environment. There is no long-lived
# registry token anywhere, in secrets or elsewhere.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only run `cargo publish --workspace --dry-run`; no tag, no release, no approval
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      mode: ${{ steps.plan.outputs.mode }}
      needed: ${{ steps.plan.outputs.needed }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Writes the decision (noop | release | recover) to the job outputs and summary.
      # Fails if [workspace.dependencies] does not require the workspace version.
      - name: Plan
        id: plan
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python3 scripts/release-plan.py plan

  verify:
    name: verify
    needs: plan
    if: needs.plan.outputs.needed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # Dry run: no environment, no OIDC token, nothing leaves the runner.
  publish-dry-run:
    name: publish (dry run)
    needs: [plan, verify]
    if: >-
      !cancelled() && needs.plan.result == 'success'
      && needs.plan.outputs.dry_run == 'true'
      && (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-27
        with:
          toolchain: stable

      - name: cargo publish --workspace --dry-run
        run: cargo publish --workspace --dry-run --locked

  publish:
    name: publish
    needs: [plan, verify]
    if: >-
      needs.plan.outputs.needed == 'true'
      && needs.plan.outputs.dry_run != 'true'
      && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write # push the tag, create the release
      id-token: write # Trusted Publishing
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-27
        with:
          toolchain: stable

      - name: Get a short-lived crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      # The list is read from the index right before publishing, in dependency order, so
      # a re-run after a partial failure skips every package that already went out.
      - name: Publish the unpublished packages
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          pending="$(python3 scripts/release-plan.py unpublished)"
          if [ -z "$pending" ]; then
            echo "Every package is already published at $VERSION."
          fi
          for package in $pending; do
            echo "::group::cargo publish -p $package"
            cargo publish -p "$package" --locked
            echo "::endgroup::"
            echo "- published \`$package\` $VERSION" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Tag the release
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; leaving it as it is."
            echo "- tag \`$TAG\` already existed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Breakwater $VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "- tagged \`$GITHUB_SHA\` as \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            echo "- release \`$TAG\` already existed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "Breakwater $VERSION on crates.io:"
            echo
            for package in $(python3 scripts/release-plan.py packages); do
              echo "- [\`$package\`](https://crates.io/crates/$package/$VERSION)"
            done
            echo
            echo '```bash'
            echo 'cargo install breakwater-cli --locked'
            echo '```'
          } > release-notes.md
          gh release create "$TAG" --verify-tag --title "Breakwater $VERSION" \
            --notes-file release-notes.md --generate-notes
          echo "- created release \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
