[package]
name = "breakwater-pack-ttl-archival"
description = "Breakwater attack pack: invariants and ledger-advance strategies for Soroban TTL state archival"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://breakwater.belvast.de"
documentation = "https://docs.rs/breakwater-pack-ttl-archival"
readme = "README.md"
keywords = ["soroban", "stellar", "invariant", "fuzzing", "ttl"]
categories = ["development-tools::testing", "cryptography::cryptocurrencies"]
include = ["src/**", "README.md", "LICENSE", "NOTICE"]
publish = true

[dependencies]
breakwater = { workspace = true }
soroban-sdk = { workspace = true, features = ["testutils"] }
serde = { workspace = true }
serde_json = { workspace = true }
