[package]
name = "example-ttl-archival"
description = "Payment-stream contract that never extends TTL, used as the ttl-archival demo target"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[features]
# `PaymentStreamFixed`, the control contract that extends TTLs. Off by default
# so the wasm build exports only the buggy `PaymentStream`: two contracts in
# one cdylib collide on their exported function names.
fixed = []
# A deliberate resource regression for the budget-snapshot demo: `withdraw`
# also writes a receipt entry. Off by default, so the wasm build is unchanged.
regress-demo = []
# A deliberate compute-only regression for the budget-snapshot demo: `cancel`
# also hashes a buffer a dozen times, which costs instructions and memory but
# reads and writes nothing. Off by default, so the wasm build is unchanged.
regress-compute = []

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
breakwater = { workspace = true }
breakwater-pack-ttl-archival = { workspace = true }
breakwater-pack-budget-snapshot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
example-ttl-archival = { path = ".", features = ["fixed"] }
