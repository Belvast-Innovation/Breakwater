[package]
name = "example-policy-bypass"
description = "Deliberately misconfigured OpenZeppelin smart account used as the policy-bypass demo target"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[features]
# Re-exports the helper contracts (owner key account, spending-limit policy,
# Ed25519 verifier) for the suite. They are separate crates under `contracts/`
# because one cdylib cannot export two `__check_auth`; off by default so the
# wasm build of this crate contains only DemoAccount.
helpers = ["dep:example-owner-account", "dep:example-spending-limit-policy", "dep:example-ed25519-verifier"]

[dependencies]
soroban-sdk = { workspace = true }
stellar-accounts = { workspace = true }
example-owner-account = { workspace = true, optional = true }
example-spending-limit-policy = { workspace = true, optional = true }
example-ed25519-verifier = { workspace = true, optional = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
breakwater = { workspace = true }
breakwater-pack-policy-bypass = { workspace = true }
ed25519-dalek = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
example-policy-bypass = { path = ".", features = ["helpers"] }
